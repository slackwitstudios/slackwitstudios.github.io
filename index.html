<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slackwit Studios</title>
<meta name="description" content="Slackwit Studios, a one-person game studio. Makers of Nova Kiln, a cosmic idle game for Android.">
<link rel="icon" href="favicon.png">
<style>
  :root { --bg: #0b0d17; --panel: #151a33; --line: #262d52; --text: #e8ebff; --soft: #b9c0e3; --gold: #ffc857; --teal: #3fe0c5; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    background: radial-gradient(1200px 600px at 50% -10%, #2a1d5c 0%, rgba(11,13,23,0) 60%), var(--bg);
    font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  a { color: var(--teal); }
  main { max-width: 760px; margin: 0 auto; padding: 48px 20px 40px; text-align: center; }
  .logo { width: min(420px, 90%); height: auto; }
  .tag { color: var(--soft); margin: 10px 0 36px; }
  .game { display: flex; gap: 22px; align-items: center; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px; }
  .game img { width: 116px; height: 116px; border-radius: 26px; flex: none; }
  .game h2 { margin: 0 0 4px; font-size: 26px; }
  .game p { margin: 0 0 8px; color: var(--soft); }
  .soon { display: inline-block; font-size: 14px; font-weight: 600; color: #1b1405; background: var(--gold); border-radius: 999px; padding: 3px 12px; }
  nav { margin-top: 36px; display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
  footer { color: var(--soft); font-size: 14px; margin-top: 44px; }
  @media (max-width: 520px) { .game { flex-direction: column; text-align: center; } }
</style>
</head>
<body>
<main>
  <img class="logo" src="slackwit-logo.png" alt="Slackwit Studios">
  <p class="tag">A one-person game studio.</p>

  <section class="game">
    <img src="nova-kiln-icon.png" alt="Nova Kiln icon">
    <div>
      <h2>Nova Kiln</h2>
      <p>Grow a speck of dust into a star. A cosmic idle game: gather matter, build orbitals, take on new forms, and open parallel universes.</p>
      <span class="soon">Coming soon to Google Play</span>
    </div>
  </section>

  <nav>
    <a href="privacy.html">Nova Kiln privacy policy</a>
    <a href="mailto:slackwitstudios@gmail.com">slackwitstudios@gmail.com</a>
  </nav>

  <footer>© 2026 Slackwit Studios. All rights reserved.</footer>
</main>
</body>
</html>
