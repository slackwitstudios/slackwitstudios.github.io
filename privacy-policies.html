<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy Policies · Slackwit Studios</title>
<meta name="description" content="Privacy policies for the games made by Slackwit Studios.">
<link rel="icon" href="favicon.png">
<style>
  :root {
    --bg: #0b0d17; --panel: #151a33; --line: #262d52; --text: #e8ebff; --soft: #b9c0e3;
    --gold: #ffc857; --violet: #b98cff; --teal: #3fe0c5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  a { color: var(--teal); }
  header { border-bottom: 1px solid var(--line); background: #0e1122; }
  .bar { max-width: 820px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .bar img { height: 44px; width: auto; display: block; }
  .bar a.home { color: var(--soft); text-decoration: none; font-size: 15px; }
  main { max-width: 820px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 32px; line-height: 1.2; margin: 8px 0 4px; }
  h2 { font-size: 22px; margin: 36px 0 8px; color: var(--gold); }
  h3 { font-size: 18px; margin: 22px 0 6px; }
  .meta { color: var(--soft); margin: 0 0 22px; }
  .summary { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--violet); border-radius: 12px; padding: 16px 20px; }
  .summary ul { margin: 6px 0 0; padding-left: 20px; }
  table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 15px; }
  th, td { text-align: left; vertical-align: top; padding: 9px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--soft); font-weight: 600; }
  .wrap { overflow-x: auto; }
  .list { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 12px; }
  .list a.item { display: flex; align-items: center; gap: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; text-decoration: none; color: var(--text); }
  .list a.item:hover, .list a.item:focus-visible { border-color: var(--teal); }
  .list img { width: 56px; height: 56px; border-radius: 13px; flex: none; }
  .list strong { display: block; font-size: 19px; }
  .list span { color: var(--soft); font-size: 15px; }
  footer { color: var(--soft); font-size: 14px; border-top: 1px solid var(--line); margin-top: 40px; padding-top: 16px; }
  @media (max-width: 520px) { h1 { font-size: 26px; } body { font-size: 16px; } .bar img { height: 36px; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a href="./"><img src="slackwit-logo.png" alt="Slackwit Studios"></a>
    <a class="home" href="./">Home</a>
  </div>
</header>
<main>
  <h1>Privacy Policies</h1>
  <p class="meta">Slackwit Studios · one policy for each of our games</p>
  <ul class="list">
    <li><a class="item" href="privacy.html">
      <img src="nova-kiln-icon.png" alt="">
      <div><strong>Nova Kiln</strong><span>Privacy policy · effective 5 October 2026</span></div>
    </a></li>
  </ul>
  <p style="margin-top:28px">Questions? Email <a href="mailto:slackwitstudios@gmail.com">slackwitstudios@gmail.com</a>.</p>
  <footer>
    <p>© 2026 Slackwit Studios. All rights reserved.</p>
  </footer>
</main>
</body>
</html>
